---
- name: Install guest tools for supported virtualization platform
  ansible.builtin.apt:
    name: "{{ virt_tools_packages[virt_tools_platform] }}"
    state: present
    update_cache: true
  when:
    - virt_tools_install | bool
    - virt_tools_platform != 'none'

- name: Enable guest tool services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ virt_tools_services[virt_tools_platform] }}"
  when:
    - virt_tools_install | bool
    - virt_tools_platform != 'none'
