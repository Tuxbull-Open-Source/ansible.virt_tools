---
- name: Determine virtualization platform
  ansible.builtin.set_fact:
    virt_tools_platform: >-
      {{ virt_tools_hypervisor if virt_tools_hypervisor != 'auto' else
         ('vmware' if ansible_virtualization_type | lower == 'vmware' else
          'kvm' if ansible_virtualization_type | lower in ['kvm', 'qemu'] else
          'none') }}

- name: Validate virtualization platform selection
  ansible.builtin.assert:
    that:
      - virt_tools_platform in ['kvm', 'vmware', 'none']
    fail_msg: virt_tools_hypervisor must be auto, kvm, vmware, or none.
